<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Expense Copilot</title>
<style>body{font-family:system-ui;max-width:680px;margin:60px auto;padding:20px}button{padding:12px 16px;margin:6px} .card{border:1px solid #ddd;border-radius:14px;padding:20px}</style></head>
<body><h1>Expense Copilot</h1><div class="card"><h2>Connect accounts</h2>
<p>This page is only for onboarding. Daily review happens in ChatGPT/Claude through MCP.</p>
<button id="bank">Connect bank with Teller</button><button disabled>Connect Splitwise (OAuth next)</button>
<p id="status"></p></div>
<script src="https://cdn.teller.io/connect/connect.js"></script>
<script>
document.getElementById("bank").onclick=async()=>{
  document.getElementById("status").textContent =
    "Teller Connect scaffold is ready. Add TELLER_APPLICATION_ID and the token callback endpoint before enabling real enrollment.";
};
</script></body></html>
